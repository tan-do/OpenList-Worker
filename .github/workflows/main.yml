name: Upstream Sync

on:
  schedule:
    - cron: '0 2 * * *' # 每天 UTC 时间 02:00 自动同步一次
  workflow_dispatch: # 保留手动触发按钮，方便随时测试

permissions:
  contents: write # 必需，允许 Action 推送更新到你的仓库

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    # 仅在 Fork 仓库中运行，避免在上游原仓库误触发
    if: ${{ github.event.repository.fork }}
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync upstream changes
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.3
        with:
          target_sync_branch: main # 你 Fork 中要同步的分支，通常是 main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # 自动生成的令牌，无需手动配置
          upstream_sync_repo: 'OpenListTeam/OpenList-Worker' # ⚠️ 替换成真实的上游仓库，例如 'torvalds/linux'
          upstream_sync_branch: main # 上游仓库的分支名
